name: EaglerAirplaneMod
version: '1.0.0'
main: org.pawling.eaglerairplane.EaglerAirplanePlugin
api-version: '1.21.11'
author: Pawling CSD Game Development
description: Evan and Liam's craftable Plane Mode system with engine startup, throttle, damage, crashes, and safe landing.

commands:
  plane:
    description: Plane controls and teacher administration
    usage: /plane <status|land|give [player]|reload>

permissions:
  eaglerairplane.admin:
    description: Allows Plane Kit administration and plugin reload
    default: op
